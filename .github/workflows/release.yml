name: Release

on:
  push:
    branches:
      - master
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (optional, defaults to package.json version)'
        required: false
        type: string

jobs:
  release:
    name: Create tag and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read package version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION as tag $VERSION"

      - name: Check if tag exists
        id: tag_check
        uses: mukunku/tag-exists-action@v1.7.0
        with:
          tag: ${{ steps.version.outputs.tag }}

      - name: Skip if tag exists
        if: ${{ steps.tag_check.outputs.exists == 'true' }}
        run: |
          echo "Tag ${{ steps.version.outputs.tag }} already exists. Skipping release."

      - name: Create GitHub Release and tag
        if: ${{ steps.tag_check.outputs.exists == 'false' }}
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
